name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    env:
      ZEPHYR_SDK_TOOLCHAINS: x86_64-zephyr-elf arm-zephyr-eabi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: install plugin
        run: mise plugin install zephyr-sdk "${{ github.workspace }}"
      - name: list available versions
        run: mise ls-remote zephyr-sdk
      - name: install a known version
        run: mise install zephyr-sdk@0.17.4
      - name: verify env vars are set
        run: |
          eval "$(mise env -s bash zephyr-sdk@0.17.4)"
          test -n "$ZEPHYR_SDK_INSTALL_DIR"
          test "$ZEPHYR_TOOLCHAIN_VARIANT" = "zephyr"
          test -f "$ZEPHYR_SDK_INSTALL_DIR/sdk_version"
      - name: run hello-world example
        working-directory: examples/hello-world
        run: |
          mise trust
          mise install
          eval "$(mise env -s bash)"
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.2.0 zephyr-workspace
          cd zephyr-workspace
          west update
          uv pip install --system -r zephyr/scripts/requirements.txt
          west zephyr-export
          west build -b native_sim/native/64 ../app
          west build -t run
