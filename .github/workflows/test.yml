name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: install plugin
        run: mise plugin install zephyr-sdk "file://${{ github.workspace }}"

      - name: list available versions
        run: mise ls-remote zephyr-sdk

      - name: install example tools
        working-directory: examples/hello-world
        run: mise trust && mise install

      - name: verify env vars are set
        run: |
          eval "$(mise env -s bash zephyr-sdk@0.17.4)"
          test -n "$ZEPHYR_SDK_INSTALL_DIR"
          test "$ZEPHYR_TOOLCHAIN_VARIANT" = "zephyr"
          test -f "$ZEPHYR_SDK_INSTALL_DIR/sdk_version"

      - name: run hello-world example
        working-directory: examples/hello-world
        run: ./run.sh
