name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        zephyr-sdk-version: [0.16.9, 0.17.2, 0.17.4, 1.0.0, 1.0.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: install plugin
        run: mise plugin install zephyr-sdk "file://${{ github.workspace }}"

      - name: configure example SDK version
        working-directory: examples/hello-world
        run: |
          mise trust
          mise use --yes zephyr-sdk@${{ matrix.zephyr-sdk-version }}

      - name: list available versions
        run: mise ls-remote zephyr-sdk

      - name: install example tools
        working-directory: examples/hello-world
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            mise use --yes python@3.12
            mise install python@3.12
            eval "$(mise env -s bash)"
            python3 --version
            case "$(command -v python3)" in
              "$HOME/.local/share/mise"/*) ;;
              *) echo "python3 is not from mise: $(command -v python3)" >&2; exit 1 ;;
            esac
          fi
          mise install --force zephyr-sdk@${{ matrix.zephyr-sdk-version }}
          mise install

      - name: print hosttools install log
        if: failure()
        run: |
          log="$HOME/.local/share/mise/installs/zephyr-sdk/${{ matrix.zephyr-sdk-version }}/hosttools-install.log"
          if [ -f "$log" ]; then
            printf '### %s\n' "$log"
            cat "$log"
          else
            printf 'hosttools install log not found: %s\n' "$log"
          fi

      - name: verify env vars are set
        run: |
          eval "$(mise env -s bash zephyr-sdk@${{ matrix.zephyr-sdk-version }})"
          test -n "$ZEPHYR_SDK_INSTALL_DIR"
          test "$ZEPHYR_TOOLCHAIN_VARIANT" = "zephyr"
          test -f "$ZEPHYR_SDK_INSTALL_DIR/sdk_version"
          x86_64-zephyr-elf-gcc --version
          arm-zephyr-eabi-gcc --version
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            openocd --version
            qemu-system-arm --version
          fi

  skip-hosttools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: install plugin
        run: mise plugin install zephyr-sdk "file://${{ github.workspace }}"

      - name: install without hosttools
        working-directory: examples/hello-world
        env:
          ZEPHYR_SDK_SKIP_HOSTTOOLS: "1"
        run: |
          mise trust
          mise use --yes zephyr-sdk@0.17.4
          mise install --force zephyr-sdk@0.17.4

      - name: verify hosttools were skipped
        working-directory: examples/hello-world
        run: |
          eval "$(mise env -s bash)"
          test -n "$ZEPHYR_SDK_INSTALL_DIR"
          x86_64-zephyr-elf-gcc --version
          arm-zephyr-eabi-gcc --version
          test ! -d "$ZEPHYR_SDK_INSTALL_DIR/hosttools"
          test ! -f "$ZEPHYR_SDK_INSTALL_DIR/hosttools-install.log"

  hello-world:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            zephyr-sdk-version: 0.17.4
            zephyr-revision: v4.2.0
          - os: macos-latest
            zephyr-sdk-version: 0.17.4
            zephyr-revision: v4.2.0
          - os: ubuntu-latest
            zephyr-sdk-version: 1.0.0
            zephyr-revision: v4.4.0
          - os: macos-latest
            zephyr-sdk-version: 1.0.0
            zephyr-revision: v4.4.0
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false

      - name: install plugin
        run: mise plugin install zephyr-sdk "file://${{ github.workspace }}"

      - name: configure example SDK version
        working-directory: examples/hello-world
        run: |
          mise trust
          mise use --yes zephyr-sdk@${{ matrix.zephyr-sdk-version }}

      - name: run hello-world example
        working-directory: examples/hello-world
        env:
          ZEPHYR_REVISION: ${{ matrix.zephyr-revision }}
        run: ./run.sh
